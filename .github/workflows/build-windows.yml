name: Build Windows EXE

# Runs the test suite, then builds the Windows executable and uploads it as a
# downloadable artifact. Triggers on every push and can be run on demand from
# the Actions tab (Run workflow).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build RPGLifer.exe (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/rpglifer.spec
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPGLifer-windows
          path: dist/RPGLifer.exe
          if-no-files-found: error
      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPGLifer-installer
          path: installer/RPGLifer-Setup.exe
          if-no-files-found: error
